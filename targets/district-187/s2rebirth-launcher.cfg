# =====================================================================
#  S2 LAUNCHER - YAPILANDIRMA
#
#  Bu dosya DUZ METINDIR ve kasitli olarak boyle birakilmistir:
#  launcher'in hangi adresten dosya indirdigini ve oyunu hangi
#  parametrelerle actigini burada ACIKCA gorebilirsiniz. Gizli bir
#  adres ya da gomulu bir sunucu yok - baska hicbir yere baglanmaz.
#
#  Satirlar:  anahtar = deger      # ile baslayan satirlar yorumdur.
# =====================================================================

# ---- GUNCELLEME KAYNAGI --------------------------------------------
# Launcher su uc adresi okur:
#     <kaynak>/manifest.json      dosya listesi + SHA-256 parmak izleri
#     <kaynak>/objects/<sha256>   dosyalarin kendisi
#     <kaynak>/news.json          launcher haber paneli
kaynak = https://gamefiles.mdcreative.tr

# Ana adres cevap vermezse OTOMATIK gecilen adres. Eski r2.dev adresi
# burada duruyor: ozel alan adinda bir aksama olursa launcher sessizce
# eskisine duser ve oyuncu ortada kalmaz. Cloudflare `pub-*.r2.dev`
# adresini hiz sinirladigi icin ARTIK YEDEK, ana adres degil.
yedek_kaynak = https://pub-0cfc578414ed464da1107a0deb13b6de.r2.dev

# ---- HD GRAFIK PAKETI (istege bagli) --------------------------------
# Ayri bir R2 kovasi. Icinde YALNIZCA Game\HD.Res00 + Game\HD.ResDt var
# (~1.7 GB); kendi manifest.json + manifest.sig dosyasiyla gelir.
# Launcher'in alt satirindaki "[ ] HD grafik paketi" anahtari bunu acar.
# Bu satir BOS ya da YOKSA anahtar hic gorunmez - HD'yi yayindan
# kaldirmanin en kisa yolu burayi bosaltmak.
hd_kaynak = https://gamefileshd.mdcreative.tr

# ---- INGILIZCE ARAYUZ PAKETI (istege bagli) -------------------------
# ~40 MB: arayuz dokulari + metin tablosu. Launcher'in alt satirindaki
# "[ ] English interface" anahtari bunu acar. Bu satir BOS ya da YOKSA
# anahtar hic gorunmez.
#
# HD'den farkli olarak AYRI KOVA GEREKMIYOR: guncelleyici icin "kaynak"
# sadece bir adres onekidir (<kaynak>/manifest.json, <kaynak>/manifest.sig,
# <kaynak>/objects/<sha256>). Ayni kovanin altindaki bir klasor yeter.
# HD'nin ayri kova olmasinin sebebi boyuttu (1.7 GB); burada o gerekce yok.
en_kaynak = https://gamefiles.mdcreative.tr/en

# ---- OYUN KLASORU ---------------------------------------------------
# launcher.exe'nin bulundugu klasore GORE yol.
# Oyuncuya giden surumde launcher oyun klasorunun ICINDE durur -> "."
# (yayin-hazirla.js bu satiri dagitim surumunde otomatik "." yapar)
# Gelistirirken LAUNCHER\istemci\ altindan calistiginiz icin iki ust klasor:
oyunklasoru = .

# ---- OYUN BASLATMA --------------------------------------------------
# THERAW-BASLATICI.ps1 ile birebir ayni komut satiri kurulur:
#   TheRaw.exe -arch game -windowtitle "<baslik>" +gs_ip <ip> +gs_port <port>
exe        = TheRaw.exe
ip         = 179.61.147.154
port       = 12000
baslik     = D187
pencereli  = 0
genislik   = 1920
yukseklik  = 1080
# Ek parametreler (bosluklarla ayrilir). Ornek: +errorlog 1 +alwaysflushlog 1
ek         =

# ---- TANI (cokme / hata raporu) --------------------------------------
# Oyun coktugunde ya da seni maçtan attiginda sebebini bulabilmemiz icin
# tutulan kayit. Adres BOS ya da YOKSA ozellik TAMAMEN KAPALIDIR: ne kayit
# tutulur, ne dosya yazilir, ne de bir sey gonderilir.
#
# ACIKKEN NE OLUYOR
#   * Launcher oyunu acip kapanmak yerine arkada bekler; oyun kapaninca
#     o oturumun kaydini `cokme_raporlari\` altina yazar.
#   * Oyunun KENDI hata ayiklama gunlugu (`ClientLog.log`) ARTIK
#     VARSAYILAN OLARAK KAPALI - asagidaki `oyun_gunlugu` ile ayri.
#     Sebep: olculdu, saniyede ~400 satir yaziyor (kare basina) ve
#     her satir uc ayri diske yazma demek. Oyunu takliyor.
#     ErrorCode 02/03 arastirilacaksa O OYUNCUDA aciliyor.
#   * Oyun her kapandiginda o oturumun kaydi sikistirilip gonderilir.
#     Tipik boyut 150 KB. EVET, SORUN OLMASA DA gonderilir: bir seyin
#     bozuk oldugunu ancak duzgun calisirken neye benzedigini bilirsek
#     anlayabiliyoruz.
#   * Cokme dokumleri (300-500 MB) ASLA gonderilmez, oyuncunun
#     bilgisayarinda kalir.
#
# Ne toplandigi oyun klasorundeki `cokme_raporlari\OKUBENI.txt` icinde
# duz Turkce yazili - oyuncu acip okuyabilir.
#
# OYUNCU KAPATMAK ISTERSE: `launcher-ozel.cfg` icine  tani_gonder = 0
#
# ---- OYUNUN KENDI GUNLUGU -------------------------------------------
# ⛔ VARSAYILAN 0 (KAPALI). 1 yapmak `ClientLog.log` uretir.
# Yalnizca ErrorCode 02/03 arastirilirken, TEK OYUNCUDA acilir.
# Herkeste acik birakma: saniyede ~400 satir, ~1200 diske yazma.
oyun_gunlugu = 0

# ---- ⛔ TANI KAPATILDI - 31.08.2026 (K-391) --------------------------
# BELIRTI: "ping spike atiyor, akicilik gidiyor, karakterler isinliyor".
#
# SEBEP OLCULDU. Tani acikken launcher AgIzi ornekleyicisini baslatiyor
# (AnaPencere.cs:2109 -> Tani.cs:311 -> AgIzi.cs). O ornekleyici
# 250 ms'de bir su ucunu birden okuyor (AgIzi.cs:263-266):
#     _oyun.Refresh()  /  WorkingSet64  /  Threads.Count
# .NET'te bu ucu NtQuerySystemInformation(SystemProcessInformation)
# cagiriyor - MAKINEDEKI TUM sureclerin anlik goruntusu:
#     ortalama 8,58 ms   tepe 13,36 ms   tampon 1.013.984 BAYT
# Saniyede DORT kez, mac boyunca (TAVAN 3 MB = ~3,3 saat). Duzenli
# 4 Hz'lik takilma tarif edilen belirtinin ta kendisi. Maliyet oyuncunun
# acik surec sayisiyla BUYUYOR - bu yuzden herkeste ayni siddette degil.
#
# ⚠ BU GECICI. Dogru duzeltme AgIzi.cs'deki surec istatistigi blogunu
# kaldirmak (ag sayaclari 0,02-0,10 ms, yani dongu 7,34 -> ~0,14 ms).
# O yama cikinca asagidaki satir geri acilacak:
#     tani = https://s2rebirth.com/api/oyuncu/tani-bilet
#
# BOS BIRAKMAK NE YAPAR: ozellik TAMAMEN kapanir - ne kayit tutulur,
# ne dosya yazilir, ne gonderilir (Tani.Acik() false doner). Cokme
# raporlari da toplanmaz; ErrorCode 02/03 arastirmasi gerekirse
# O OYUNCUDA launcher-ozel.cfg ile tek tek acilir.
tani =

# ---- ANTI-HILE RAPOR KOPRUSU (acik-kaynak-launcher/kaynak/ApexKanal.cs) ----
# ApexGuard bulgularini OYUN SURECINDE paylasimli bellege yaziyor (tek
# memcpy, olculdu 21 ns); launcher onlari okuyup buraya POST ediyor.
# Oyun surecinde ag/disk isi YOK - yukaridaki `tani` takilmasinin sebebi
# olan surec istatistigi cagrilarinin (Refresh/WorkingSet/Threads) HICBIRI
# kullanilmiyor, yalnizca HasExited (tutamak sorgusu, anlik goruntu yok).
#
# BOS BIRAKILIRSA kopru hic kurulmaz - paylasimli bellek acilmaz, tek bayt
# gitmez. ApexGuard yine calisir ve ihlalde oyunu kapatir; sunucu yalnizca
# GORMEZ.
#
# Oyuncu kapatmak isterse launcher-ozel.cfg icine `apex_gonder = 0`.
apex = https://s2rebirth.com/api/oyuncu/apex-rapor

